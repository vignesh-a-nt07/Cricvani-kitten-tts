---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - make
      - curl
      - git
      - espeak-ng
    state: present

- name: Create dedicated application group
  group:
    name: "{{ app_group }}"
    state: present

- name: Create dedicated application user
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: yes
    create_home: no
    shell: /bin/false

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Synchronize application code to server
  synchronize:
    src: "{{ local_app_dir }}/"
    dest: "{{ app_dir }}/"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.venv"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=node_modules"
      - "--exclude=logs"
      - "--exclude=secrets"
      - "--exclude=terraform"
      - "--exclude=ansible"
      - "--exclude=*.pem"
      - "--exclude=*.key"
  notify: restart application

- name: Set permissions on application directory
  file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes

- name: Create Python virtual environment
  command: python3 -m venv "{{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/python"

- name: Set permissions on virtual environment
  file:
    path: "{{ venv_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes

- name: Install Python dependencies
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    virtualenv_command: /usr/bin/python3 -m venv
  become: yes
  become_user: "{{ app_user }}"

- name: Create systemd service file
  template:
    src: kitten-tts.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

- name: Note about manual startup
  debug:
    msg: "Ansible setup complete! The application has NOT been automatically started. Please log in and use 'make run' to test manually, or use 'sudo systemctl start {{ app_name }}' if you prefer systemd."
