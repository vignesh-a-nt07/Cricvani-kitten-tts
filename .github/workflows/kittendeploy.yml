name: Deploy Kitten TTS

on:
  workflow_dispatch:
    inputs:
      ec2_host:
        description: 'Public IP or DNS of the existing Kitten TTS EC2 instance'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_USERNAME: ${{ vars.EC2_USERNAME || 'ubuntu' }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/cricvani-kitten-tts' }}
      APP_PORT: ${{ vars.APP_PORT || '8001' }}
      SYSTEMD_SERVICE: ${{ vars.SYSTEMD_SERVICE || 'cricvani-kitten-tts' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/kitten-tts.pem
          chmod 600 ~/.ssh/kitten-tts.pem
          
          cat <<EOF > ~/.ssh/config
          Host staging-ec2
            HostName ${{ github.event.inputs.ec2_host }}
            User ${{ env.EC2_USERNAME }}
            IdentityFile ~/.ssh/kitten-tts.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Wait for SSH Availability
        run: |
          set -e
          echo "Waiting for SSH to become available..."
          for i in {1..60}; do
            if ssh -q staging-ec2 exit; then
              echo "SSH is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "SSH did not become available in time."
          exit 1

      - name: Configure EC2 Server
        run: |
          set -e
          ssh staging-ec2 << 'EOF'
            set -e
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-venv python3-dev build-essential make curl git espeak-ng

            if ! getent group kittentts >/dev/null; then
              sudo groupadd kittentts
            fi
            if ! getent passwd kittentts >/dev/null; then
              sudo useradd -g kittentts -s /bin/false -M kittentts
            fi

            sudo mkdir -p ${{ env.APP_DIR }}/venv
            sudo chown -R ${{ env.EC2_USERNAME }}:${{ env.EC2_USERNAME }} ${{ env.APP_DIR }}
          EOF

      - name: Copy Application Files
        run: |
          set -e
          rsync -avz --exclude '.git' --exclude '.github' --exclude '.venv' --exclude 'venv' --exclude 'node_modules' --exclude '__pycache__' --exclude 'terraform' --exclude 'ansible' --exclude '.env' --exclude '*.pem' --exclude '*.key' ./ staging-ec2:${{ env.APP_DIR }}/

      - name: Setup Python Environment and Systemd
        run: |
          set -e
          ssh staging-ec2 << 'EOF'
            set -e
            cd ${{ env.APP_DIR }}
            
            # Setup virtual environment natively
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            
            sudo chown -R kittentts:kittentts ${{ env.APP_DIR }}
            
            # Create systemd service (idempotent)
            cat << 'SVC' | sudo tee /etc/systemd/system/${{ env.SYSTEMD_SERVICE }}.service
            [Unit]
            Description=CricVani Kitten TTS Server
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=kittentts
            Group=kittentts
            WorkingDirectory=${{ env.APP_DIR }}
            # Pass HuggingFace token if available in environment
            Environment="HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}"
            ExecStart=${{ env.APP_DIR }}/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port ${{ env.APP_PORT }}
            Restart=on-failure
            RestartSec=5

            StandardOutput=journal
            StandardError=journal
            SyslogIdentifier=${{ env.SYSTEMD_SERVICE }}

            [Install]
            WantedBy=multi-user.target
            SVC

            sudo systemctl daemon-reload
            sudo systemctl enable ${{ env.SYSTEMD_SERVICE }}
            sudo systemctl restart ${{ env.SYSTEMD_SERVICE }}
            
            sudo systemctl is-active --quiet ${{ env.SYSTEMD_SERVICE }} || {
              echo "Service failed to start!"
              sudo systemctl status ${{ env.SYSTEMD_SERVICE }} --no-pager
              sudo journalctl -u ${{ env.SYSTEMD_SERVICE }} -n 100 --no-pager
              exit 1
            }
          EOF

      - name: Health Check & Model Verification
        run: |
          set -e
          echo "Waiting for Kitten TTS to start and load the model..."
          for i in {1..60}; do
            RESPONSE=$(ssh staging-ec2 "curl -fsS http://127.0.0.1:${{ env.APP_PORT }}/health" || echo 'FAILED')
            if [ "$RESPONSE" != "FAILED" ]; then
              echo "Health endpoint returned: $RESPONSE"
              if echo "$RESPONSE" | grep -q '"degraded"' || echo "$RESPONSE" | grep -q '"loaded": false'; then
                echo "Warning: Model appears degraded or not loaded. Waiting..."
              else
                echo "Service is healthy and model is loaded."
                exit 0
              fi
            fi
            echo "Waiting for Kitten TTS..."
            sleep 5
          done
          
          echo "Health check failed or model did not load in time."
          echo "--- systemctl status ---"
          ssh staging-ec2 "sudo systemctl status ${{ env.SYSTEMD_SERVICE }} --no-pager" || true
          echo "--- journalctl logs ---"
          ssh staging-ec2 "sudo journalctl -u ${{ env.SYSTEMD_SERVICE }} -n 150 --no-pager" || true
          echo "--- memory ---"
          ssh staging-ec2 "free -h" || true
          echo "--- disk ---"
          ssh staging-ec2 "df -h" || true
          echo "--- network ---"
          ssh staging-ec2 "ss -lntp | grep ${{ env.APP_PORT }}" || true
          exit 1

      - name: Cleanup Temporary SSH Key
        if: always()
        run: rm -f ~/.ssh/kitten-tts.pem ~/.ssh/config

      - name: Final Output
        run: |
          echo "========================================" >> $GITHUB_STEP_SUMMARY
          echo "## Kitten TTS Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "========================================" >> $GITHUB_STEP_SUMMARY
          echo "**Server:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ github.event.inputs.ec2_host }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application:**" >> $GITHUB_STEP_SUMMARY
          echo "CricVani Kitten TTS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Port:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.APP_PORT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Health:**" >> $GITHUB_STEP_SUMMARY
          echo "\`http://${{ github.event.inputs.ec2_host }}:${{ env.APP_PORT }}/health\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CricVani URL:**" >> $GITHUB_STEP_SUMMARY
          echo "\`http://${{ github.event.inputs.ec2_host }}:${{ env.APP_PORT }}\`" >> $GITHUB_STEP_SUMMARY
