name: Deploy Kitten TTS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy code to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.py,config.py,requirements.txt,Makefile,routes,services,providers,utils,models"
          target: "/home/ubuntu/cricvani-kitten-tts"

      - name: Deploy and start server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/cricvani-kitten-tts

            python3 -m venv venv

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            pkill -f "uvicorn app:app" || true

            nohup ./venv/bin/python -m uvicorn app:app \
              --host 0.0.0.0 \
              --port 8001 \
              > logs/server.log 2>&1 &

            echo "Kitten TTS started"
