name: Deploy Kitten TTS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy code to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.py,config.py,requirements.txt,Makefile,routes,services,providers,utils,models"
          target: "/home/ubuntu/cricvani-kitten-tts"

      - name: Deploy and start server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/cricvani-kitten-tts

            mkdir -p logs

            echo "Creating Python virtual environment..."
            python3 -m venv venv

            echo "Installing dependencies..."
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            echo "Stopping previous Kitten TTS server..."

            if [ -f kitten.pid ]; then
              kill "$(cat kitten.pid)" 2>/dev/null || true
              rm -f kitten.pid
              sleep 2
            fi

            echo "Starting Kitten TTS server..."

            nohup ./venv/bin/python -m uvicorn app:app \
              --host 0.0.0.0 \
              --port 8001 \
              > logs/server.log 2>&1 &

            echo $! > kitten.pid

            echo "Kitten TTS process started with PID $(cat kitten.pid)"

            sleep 10

            echo "Checking Kitten TTS server..."

            curl -f http://localhost:8001/health

            echo "Kitten TTS deployed successfully!"