version: '3.8'

services:
  tts-server:
    build: .
    container_name: cricvani-kitten-tts-server
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
      - ./generated:/app/generated
      - ./models:/app/models
      - ./.env:/app/.env
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8001
